[package]
name = "videopipeline-core"
version = "0.19.0"
edition = "2021"
description = "VideoPipeline — pełna logika kodowania (biblioteka dynamiczna)"

[lib]
name = "videopipeline_core"
path = "src/lib.rs"
# Rust nie ma stabilnego ABI: biblioteka i binarka muszą być zbudowane tym samym rustc.
crate-type = ["dylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Dolby Vision RPU i HDR10+ (biblioteki z dovi_tool / hdr10plus_tool) — wstrzykiwanie w locie.
dolby_vision = "3.4"
hdr10plus = { version = "2.1", features = ["hevc", "json"] }
# Odczyt plików przez libavformat / libavcodec (biblioteki dynamiczne FFmpeg) zamiast ffprobe.
ffmpeg-next = { version = "9.1", default-features = false, features = ["format", "codec"], optional = true }

[features]
# Paczki budują z „libav”; bez niej (np. szybki build deweloperski bez nagłówków FFmpeg) — ffprobe.
libav = ["dep:ffmpeg-next"]
